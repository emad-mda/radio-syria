name: فحص المحطات اليومي

on:
  schedule:
    - cron: '0 3 * * *'   # كل يوم 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check stations
        id: check
        run: node .github/scripts/check-stations.mjs

      - name: Summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet && exit 0
          git commit -m "تحديث حالة المحطات"
          git push

      # يصلك بريد من GitHub عند فتح التذكرة
      - name: Open issue for newly broken stations
        if: steps.check.outputs.newly_dead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "محطات تعطّلت — $(date -u +%F)" --body-file report.md
